<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NekoTube Premium - プロキシ対応版</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .box { background-color: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; background: #0d1117; color: white; border: 1px solid #30363d; border-radius: 4px; box-sizing: border-box; }
        button { background: #238636; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        button:hover { background: #2ea44f; }
        .video-card { background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 25px; }
        .video-frame { width: 100%; aspect-ratio: 16/9; background: black; border-radius: 6px; margin: 10px 0; }
        .comment-area { margin-top: 15px; border-top: 1px solid #30363d; padding-top: 15px; }
        .comment-item { background: #21262d; padding: 8px; margin-top: 5px; border-radius: 4px; font-size: 14px; border-left: 3px solid #58a6ff; }
        .flex { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🐈‍⬛ NekoTube Share (Supabase連携版)</h1>

    <!-- 🔑 ユーザー名・パスワードログインエリア -->
    <div class="box" id="authArea">
        <h3>🔐 アカウント認証（ログイン / 新規登録）</h3>
        <p style="font-size:12px; color:#8b949e;">※初めて使う名前の場合は、自動的にそのパスワードで新規会員登録されます！</p>
        <input type="text" id="usernameInput" placeholder="ユーザー名を入力...">
        <input type="password" id="passwordInput" placeholder="パスワードを入力...">
        <button onclick="handleAuth()">ログイン / アカウント作成</button>
    </div>

    <div class="box" id="userStatus" style="display:none;">
        👤 ログイン中: <strong id="currentUserName" style="color:#58a6ff;">ゲスト</strong>
        <button onclick="logout()" style="background:#30363d; width:auto; padding:5px 10px; float:right; margin:0;">ログアウト</button>
        <div style="clear:both;"></div>
    </div>

    <!-- 🚀 本当に共有できる動画投稿エリア -->
    <div class="box" id="uploadArea" style="display:none;">
        <h3>🚀 新しい動画をタイムラインに共有する</h3>
        <input type="text" id="vTitle" placeholder="動画のタイトル">
        <textarea id="vDesc" placeholder="動画の説明文"></textarea>
        <input type="text" id="vUrl" placeholder="動画ファイルの直リンクURL (mp4など)">
        <button onclick="uploadVideo()">世界へ投稿する（永久保存）</button>
    </div>

    <!-- 📺 本物の同期タイムライン -->
    <h3>📺 みんなが投稿した動画</h3>
    <div id="timeline">データベースから動画を読み込み中...</div>
</div>

<!-- Supabaseのプログラムを読み込む（最新版） -->
<script src="https://jsdelivr.net"></script>
<script>
    // --- 【超重要】あなた専用のSupabase設定に書き換えてください ---
    const SUPABASE_URL = "【ここにPROJECT URLを貼り付け】";
    const SUPABASE_KEY = "【ここにAPI KEY (anon public) を貼り付け】";
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let loginUser = localStorage.getItem('nt_s_user') || "";

    window.onload = function() {
        if(loginUser) { showLoggedInState(); }
        loadVideos();
        // 友達が投稿したら自動で画面が変わるリアルタイム監視
        supabase.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', filter: 'table=eq.posts' }, loadVideos)
            .subscribe();
    };

    // 🔑 ユーザー名＋パスワード認証のロジック
    async function handleAuth() {
        const name = document.getElementById('usernameInput').value.trim();
        const pass = document.getElementById('passwordInput').value.trim();
        if(!name || !pass) return alert('ユーザー名とパスワードを入力してください！');

        // データベースにそのユーザーがいるか確認
        const { data: users, error } = await supabase.from('users').select('*').eq('username', name);
        
        if (users.length === 0) {
            // いなければ新しいアカウントとして登録
            await supabase.from('users').insert([{ username: name, password: pass }]);
            alert('🎉 新規アカウントを作成し、ログインしました！');
        } else {
            // いればパスワードが合っているか確認
            if(users[0].password !== pass) {
                alert('❌ パスワードが間違っています！別の名前を使うか正しく入力してください。');
                return;
            }
            alert('🔓 ログインに成功しました！');
        }

        loginUser = name;
        localStorage.setItem('nt_s_user', name);
        showLoggedInState();
        loadVideos();
    }

    function logout() {
        loginUser = "";
        localStorage.removeItem('nt_s_user');
        document.getElementById('authArea').style.display = 'block';
        document.getElementById('userStatus').style.display = 'none';
        document.getElementById('uploadArea').style.display = 'none';
        loadVideos();
    }

    function showLoggedInState() {
        document.getElementById('authArea').style.display = 'none';
        document.getElementById('userStatus').style.display = 'block';
        document.getElementById('uploadArea').style.display = 'block';
        document.getElementById('currentUserName').innerHTML = loginUser;
    }

    // 🚀 動画の本当の投稿処理
    async function uploadVideo() {
        const title = document.getElementById('vTitle').value.trim();
        const desc = document.getElementById('vDesc').value.trim();
        const url = document.getElementById('vUrl').value.trim();

        if(!title || !url) return alert('タイトルと動画URLは必須です！');

        await supabase.from('posts').insert([
            { title: title, desc: desc, url: url, author: loginUser, views: 0, comments: [] }
        ]);

        document.getElementById('vTitle').value = '';
        document.getElementById('vDesc').value = '';
        document.getElementById('vUrl').value = '';
        alert('🎉 データベースに保存され、全員の画面へ同期されました！');
        loadVideos();
    }

    // 📺 データベースから全員の動画を読み込む処理
    async function loadVideos() {
        const { data: posts, error } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
        var timeline = document.getElementById('timeline');
        timeline.innerHTML = '';

        if(!posts || posts.length === 0) {
            timeline.innerHTML = 'まだ動画がありません';
            return;
        }

        posts.forEach(video => {
            var commentHtml = '';
            const comments = video.comments || [];
            comments.forEach(c => {
                commentHtml += '<div class="comment-item"><strong>' + c.user + ':</strong> ' + c.text + '</div>';
            });

            var card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = 
                '<h2>' + video.title + '</h2>' +
                '<p style="font-size:12px; color:#8b949e;">投稿者: ' + video.author + '</p>' +
                '<video class="video-frame" src="' + video.url + '" controls onplay="countView(' + video.id + ', ' + video.views + ')"></video>' +
                '<p>👁️ 視聴数: <span id="v-view-' + video.id + '">' + video.views + '</span> 回</p>' +
                '<p style="background:#0d1117; padding:10px; border-radius:4px;">説明: ' + video.desc + '</p>' +
                '<div class="comment-area">' +
                    '<h4>💬 コメント</h4>' +
                    '<div class="flex">' +
                        '<input type="text" id="c-input-' + video.id + '" placeholder="コメントを入力..." ' + (loginUser ? '' : 'disabled') + '>' +
                        '<button onclick="addComment(' + video.id + ')" style="width:80px; margin:0;" ' + (loginUser ? '' : 'disabled') + '>送信</button>' +
                    '</div>' +
                    '<div style="margin-top:10px;">' + commentHtml + '</div>' +
                '</div>';

            timeline.appendChild(card);
        });
    }

    // 👁️ 視聴数を本当にデータベースにプラス1する
    async function countView(id, currentViews) {
        const videoElement = document.querySelector(`video[src]`);
        // 擬似的に連続カウントを防ぐ処理
        if(videoElement.dataset.counted === "true") return;
        videoElement.dataset.counted = "true";

        await supabase.from('posts').update({ views: currentViews + 1 }).eq('id', id);
        document.getElementById('v-view-' + id).innerHTML = currentViews + 1;
    }

    // 💬 コメントを本当にデータベースの配列に追加して共有する
    async function addComment(id) {
        if(!loginUser) return;
        var input = document.getElementById('c-input-' + id);
        var text = input.value.trim();
        if(!text) return;

        // 今のコメントリストを取得
        const { data } = await supabase.from('posts').select('comments').eq('id', id);
        let currentComments = data[0].comments || [];
        
        // 新しいコメントを追加
        currentComments.push({ user: loginUser, text: text });

        // データベースを更新
        await supabase.from('posts').update({ comments: currentComments }).eq('id', id);
        input.value = '';
        loadVideos();
    }
</script>
</body>
</html>
