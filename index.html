<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ネコチューブ - 100%動く最終版</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; padding: 20px; }
        .box { background-color: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 20px; }
        input, textarea { width: 90%; padding: 8px; margin: 5px 0; background: #0d1117; color: white; border: 1px solid #30363d; border-radius: 4px; }
        button { background: #238636; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ea44f; }
        .video-card { background: #21262d; padding: 15px; border-radius: 6px; margin-top: 15px; border: 1px solid #30363d; }
        .video-frame { width: 100%; aspect-ratio: 16/9; background: black; border-radius: 4px; margin: 10px 0; }
        .comment-item { background: #161b22; padding: 5px 10px; margin-top: 5px; border-radius: 4px; font-size: 14px; }
        .admin-section { border: 1px solid #f85149; padding: 10px; display: none; margin-top: 15px; }
    </style>
</head>
<body>

<h1>🐈‍⬛ NekoTube (超シンプル動作保証版)</h1>

<!-- 📢 お知らせ -->
<div class="box" style="border-left: 4px solid #58a6ff;">
    <strong>📢 お知らせ:</strong> <span id="newsText">学校のパソコンでも絶対に動くモードで起動中！</span>
</div>

<!-- 🔑 ログインエリア -->
<div class="box" id="loginArea">
    <h3>👤 1. ユーザー名を入力してログイン</h3>
    <input type="text" id="usernameInput" placeholder="あなたの名前（例：ねこ太郎）">
    <button onclick="userLogin()">ログインする</button>
</div>
<div class="box" id="userBadge" style="display:none;">
    👤 ログイン中: <strong id="currentUserName">ゲスト</strong>
    <button onclick="userLogout()" style="background:#30363d; margin-left:10px;">ログアウト</button>
</div>

<div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
    <!-- 左側：動画エリア -->
    <div>
        <!-- 🚀 投稿フォーム -->
        <div class="box">
            <h3>🚀 2. 動画を投稿する</h3>
            <input type="text" id="vTitle" placeholder="動画の名前（タイトル）"><br>
            <textarea id="vDesc" placeholder="動画の説明文"></textarea><br>
            <p style="font-size:12px; color:#8b949e; margin:0;">下に動画のURLを貼るか、すぐ下のボタンからファイルを選んでね！</p>
            <input type="text" id="vUrl" placeholder="動画のURL（空欄でもOK）"><br>
            <input type="file" id="vFile" accept="video/*"><br><br>
            <button onclick="addVideo()">タイムラインに投稿</button>
        </div>

        <!-- 📺 動画一覧 -->
        <div class="box">
            <h3>📺 投稿された動画一覧</h3>
            <div id="timeline">ここに投稿した動画が表示されます</div>
        </div>
    </div>

    <!-- 右側：管理者＆お問い合わせ -->
    <div>
        <div class="box">
            <h3>🛠️ 管理者機能</h3>
            <p style="font-size:12px;">ユーザー名を「管理者」にしてログインすると使えます</p>
            <div id="adminPanel" class="admin-section">
                <label>📢 お知らせ書き換え</label>
                <input type="text" id="newNewsText"><br>
                <button onclick="changeNews()">お知らせ更新</button>
                <hr style="border:0; border-top:1px solid #30363d; margin:10px 0;">
                <label>🚫 ユーザーブロック</label>
                <input type="text" id="blockTarget" placeholder="ブロックするユーザー名"><br>
                <button onclick="blockUser()" style="background:#f85149;">アクセス禁止にする</button>
                <p id="blockList" style="font-size:12px; color:#8b949e; margin-top:5px;"></p>
            </div>
        </div>

        <div class="box">
            <h3>💬 お問い合わせ</h3>
            <p style="font-size:13px;">バグ報告やリクエストは、学校のブロックに引っかからない「Scratch（スクラッチ）」のコメント欄に送ってね！</p>
        </div>
    </div>
</div>

<script>
    // 完全にブラウザの一時メモリだけで動かす（学校のブロック対策）
    var videoList = [];
    var blockedList = [];
    var loginUser = "";
    var forbiddenWords = ["あほ", "バカ", "死ね"];

    function userLogin() {
        var name = document.getElementById('usernameInput').value;
        if(!name) { alert('名前を入力してください！'); return; }
        if(blockedList.indexOf(name) !== -1) { alert('🚫 あなたの名前はブロックされています！'); return; }

        loginUser = name;
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('userBadge').style.display = 'block';
        document.getElementById('currentUserName').innerHTML = loginUser;

        if(loginUser === "管理者" || loginUser === "admin") {
            document.getElementById('adminPanel').style.display = 'block';
        }
        showVideos();
    }

    function userLogout() {
        loginUser = "";
        document.getElementById('userBadge').style.display = 'none';
        document.getElementById('loginArea').style.display = 'block';
        document.getElementById('adminPanel').style.display = 'none';
        showVideos();
    }

    function addVideo() {
        if(!loginUser) { alert('先にログインしてください！'); return; }
        
        var title = document.getElementById('vTitle').value;
        var desc = document.getElementById('vDesc').value;
        var url = document.getElementById('vUrl').value;
        var fileInput = document.getElementById('vFile');

        // ファイルが選択されている場合はそのファイルを擬似URLにする
        if (fileInput.files.length > 0) {
            url = URL.createObjectURL(fileInput.files[0]);
        }

        if(!title || !url) { alert('タイトルと、URL入力またはファイル選択をしてください！'); return; }

        var newVideo = {
            id: new Date().getTime(),
            title: title,
            desc: desc,
            url: url,
            author: loginUser,
            views: 0,
            comments: []
        };

        videoList.unshift(newVideo);
        
        document.getElementById('vTitle').value = '';
        document.getElementById('vDesc').value = '';
        document.getElementById('vUrl').value = '';
        fileInput.value = '';
        
        alert('🎉 投稿しました！');
        showVideos();
    }

    function showVideos() {
        var timeline = document.getElementById('timeline');
        timeline.innerHTML = '';

        if(videoList.length === 0) {
            timeline.innerHTML = 'まだ動画がありません';
            return;
        }

        for(var i = 0; i < videoList.length; i++) {
            var video = videoList[i];
            if(blockedList.indexOf(video.author) !== -1) { continue; }

            var commentHtml = '';
            for(var j = 0; j < video.comments.length; j++) {
                commentHtml += '<div class="comment-item"><strong>' + video.comments[j].user + ':</strong> ' + video.comments[j].text + '</div>';
            }

            var card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = 
                '<h2>' + video.title + '</h2>' +
                '<p style="font-size:12px; color:#8b949e;">投稿者: ' + video.author + '</p>' +
                '<video class="video-frame" src="' + video.url + '" controls onplay="countView(' + video.id + ')"></video>' +
                '<p>👁️ 視聴数: <span id="v-view-' + video.id + '">' + video.views + '</span> 回</p>' +
                '<p style="background:#0d1117; padding:10px; border-radius:4px;">説明: ' + video.desc + '</p>' +
                '<div style="margin-top:10px;">' +
                    '<input type="text" id="c-input-' + video.id + '" placeholder="コメントを入力..." style="width:70%;">' +
                    '<button onclick="addComment(' + video.id + ')" style="padding:5px 10px; margin-left:5px;">送信</button>' +
                '</div>' +
                '<div style="margin-top:10px;">' + commentHtml + '</div>';

            timeline.appendChild(card);
        }
    }

    function countView(id) {
        for(var i = 0; i < videoList.length; i++) {
            if(videoList[i].id === id) {
                videoList[i].views += 1;
                document.getElementById('v-view-' + id).innerHTML = videoList[i].views;
                break;
            }
        }
    }

    function addComment(id) {
        if(!loginUser) { alert('ログインしてください！'); return; }
        var input = document.getElementById('c-input-' + id);
        var text = input.value;
        if(!text) return;

        for(var i = 0; i < forbiddenWords.length; i++) {
            if(text.indexOf(forbiddenWords[i]) !== -1) {
                alert('⚠️ 不適切な言葉が含まれているため、伏せ字になります');
                text = text.replace(new RegExp(forbiddenWords[i], 'g'), '■■■');
            }
        }

        for(var i = 0; i < videoList.length; i++) {
            if(videoList[i].id === id) {
                videoList[i].comments.push({ user: loginUser, text: text });
                input.value = '';
                showVideos();
                break;
            }
        }
    }

    function changeNews() {
        var text = document.getElementById('newNewsText').value;
        if(!text) return;
        document.getElementById('newsText').innerHTML = text;
        alert('お知らせを変更しました！');
    }

    function blockUser() {
        var name = document.getElementById('blockTarget').value;
        if(!name) return;
        if(blockedList.indexOf(name) === -1) {
            blockedList.push(name);
            alert(name + ' をアクセスブロックしました！');
            document.getElementById('blockTarget').value = '';
            document.getElementById('blockList').innerHTML = "ブロック中: " + blockedList.join(', ');
            showVideos();
        }
    }
</script>
</body>
</html>
