<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ネコチューブ - 自動リフレッシュ・完全解決版</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; padding: 20px; }
        .box { background-color: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 20px; }
        input, textarea { width: 95%; padding: 10px; margin: 5px 0; background: #0d1117; color: white; border: 1px solid #30363d; border-radius: 4px; box-sizing: border-box; }
        button { background: #238636; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ea44f; }
        .video-card { background: #21262d; padding: 15px; border-radius: 6px; margin-top: 15px; border: 1px solid #30363d; }
        .video-frame { width: 100%; aspect-ratio: 16/9; background: black; border-radius: 4px; margin: 10px 0; }
        .comment-item { background: #161b22; padding: 5px 10px; margin-top: 5px; border-radius: 4px; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
    </style>
</head>
<body>

<h1>🐈‍⬛ NekoTube (自動リフレッシュ搭載・完全版)</h1>

<!-- 🔑 1. ログインエリア -->
<div class="box" id="authArea">
    <h3>👤 アカウント作成 / ログイン</h3>
    <input type="text" id="usernameInput" placeholder="ユーザー名"><br>
    <input type="password" id="passwordInput" placeholder="パスワード"><br>
    <button onclick="handleAuth('login')">ログインする</button>
    <button onclick="handleAuth('signup')" style="background:#007aff; margin-left:10px;">新しくアカウントを作る</button>
</div>

<div class="box" id="userBadge" style="display:none;">
    👤 ログイン中: <strong id="currentUserName">ゲスト</strong>
    <button onclick="userLogout()" style="background:#30363d; margin-left:10px;">ログアウト</button>
</div>

<!-- 🚀 2. 動画投稿フォーム -->
<div class="box" id="uploadFormSection" style="border: 1px solid #58a6ff;">
    <h3>🚀 新しい動画をアップロードして共有する</h3>
    
    <div class="form-group">
        <label style="font-weight:bold; color:#58a6ff;">① 動画の名前（タイトル）</label><br>
        <input type="text" id="vTitle" placeholder="動画のタイトルを入力...">
    </div>
    
    <div class="form-group">
        <label style="font-weight:bold; color:#58a6ff;">② 動画の説明文</label><br>
        <textarea id="vDesc" placeholder="動画の説明文を入力..." rows="3"></textarea>
    </div>
    
    <div class="form-group">
        <label style="font-weight:bold; color:#58a6ff;">③ 動画ファイルを選択（mp4など）</label><br>
        <input type="file" id="vFile" accept="video/*">
    </div>
    
    <button onclick="addVideo()" id="uploadBtn" style="width:100%; font-size:16px; padding:12px;">🚀 サーバーにアップロードして投稿する！</button>
    <p id="uploadStatus" style="color:#58a6ff; font-weight:bold; text-align:center; margin-top:10px;"></p>
</div>

<!-- 📺 3. みんなの動画一覧 -->
<div class="box">
    <h3>📺 みんなの動画一覧</h3>
    <div id="timeline">動画を読み込み中...</div>
</div>

<!-- Supabaseの仕組みを読み込む -->
<script src="https://jsdelivr.net"></script>
<script>
    const SUPABASE_URL = "https://supabase.co";
    // 🔑 ここにあなたの「anon publicキー」を貼り付けてね！
    const SUPABASE_KEY = "【ここにSupabase画面のanon publicキーを貼り付け】"; 
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    var loginUser = localStorage.getItem('n_user_sp') || "";

    window.onload = function() {
        if(loginUser) { checkLoginState(); }
        showVideos();
    };

    // アカウント作成とログイン
    async function handleAuth(type) {
        var user = document.getElementById('usernameInput').value.trim();
        var pass = document.getElementById('passwordInput').value.trim();
        if(!user || !pass) return alert('ユーザー名とパスワードを入力してください！');

        if(type === 'signup') {
            const { error } = await _supabase.from('users').insert([{ username: user, password: pass }]);
            if(error) { alert('エラー：このユーザー名は既に使われているか、テーブルが作成されていません。'); }
            else { alert('🎉 アカウント作成成功！ログインしてください！'); }
        } else {
            const { data, error } = await _supabase.from('users').select('*').eq('username', user).eq('password', pass);
            if(data && data.length > 0) {
                loginUser = user;
                localStorage.setItem('n_user_sp', user);
                checkLoginState();
                showVideos();
            } else { alert('ユーザー名かパスワードが違います！'); }
        }
    }

    function userLogout() {
        loginUser = "";
        localStorage.removeItem('n_user_sp');
        document.getElementById('userBadge').style.display = 'none';
        document.getElementById('authArea').style.display = 'block';
        showVideos();
    }

    function checkLoginState() {
        document.getElementById('authArea').style.display = 'none';
        document.getElementById('userBadge').style.display = 'block';
        document.getElementById('currentUserName').innerHTML = loginUser;
    }

    // 動画を直接アップロード
    async function addVideo() {
        if(!loginUser) return alert('先にログインしてください！');
        var title = document.getElementById('vTitle').value;
        var desc = document.getElementById('vDesc').value;
        var fileInput = document.getElementById('vFile');

        if(!title || fileInput.files.length === 0) return alert('タイトルと動画ファイルを選択してください！');

        var file = fileInput.files[0]; // 単一ファイル取得のバグを修正
        var statusText = document.getElementById('uploadStatus');
        var btn = document.getElementById('uploadBtn');

        statusText.textContent = "⏳ 動画ファイルをサーバーに直接アップロード中...（閉じないでね）";
        btn.disabled = true;

        try {
            var fileExt = file.name.split('.').pop();
            var fileName = Date.now() + '.' + fileExt;
            var filePath = fileName;

            const { data: uploadData, error: uploadError } = await _supabase.storage
                .from('videos')
                .upload(filePath, file);

            if (uploadError) throw uploadError;

            const { data: urlData } = _supabase.storage
                .from('videos')
                .getPublicUrl(filePath);

            var generatedUrl = urlData.publicUrl;

            // 波カッコのバグを完全に修正しました！
            const { error: dbError } = await _supabase.from('posts').insert([
                { title: title, description: desc, url: generatedUrl, author: loginUser }
            ]);

            if (dbError) throw dbError;

            statusText.textContent = "🎉 アップロード＆投稿が完全完了しました！";
            document.getElementById('vTitle').value = '';
            document.getElementById('vDesc').value = '';
            fileInput.value = '';
            showVideos();

        } catch (err) {
            console.error(err);
            statusText.textContent = "❌ Error: アップロードに失敗しました。";
        } finally {
            btn.disabled = false;
        }
    }

    // タイムライン読み込み
    async function showVideos() {
        var timeline = document.getElementById('timeline');
        const { data: videos, error } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
        
        timeline.innerHTML = '';
        if(!videos || videos.length === 0) { timeline.innerHTML = 'まだ動画がありません'; return; }

        for(var i = 0; i < videos.length; i++) {
            var video = videos[i];
            var commentHtml = (video.comments || []).map(c => `<div class="comment-item"><strong>${c.user}:</strong> ${c.text}</div>`).join('');

            var card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = 
                '<h2>' + video.title + '</h2>' +
                '<p style="font-size:12px; color:#8b949e;">投稿者: ' + video.author + '</p>' +
                '<video class="video-frame" src="' + video.url + '" controls onplay="countView(' + video.id + ', ' + video.views + ')"></video>' +
                '<p>👁️ 視聴数: <span id="v-view-' + video.id + '">' + video.views + '</span> 回</p>' +
                '<p style="background:#0d1117; padding:10px; border-radius:4px;">説明: ' + (video.description || '説明はありません') + '</p>' +
                '<div style="margin-top:10px;">' +
                    '<input type="text" id="c-input-' + video.id + '" placeholder="コメントを入力..." style="width:70%;">' +
                    '<button onclick="addComment(' + video.id + ')" style="padding:5px 10px; margin-left:5px;">送信</button>' +
                '</div>' +
                '<div style="margin-top:10px;">' + commentHtml + '</div>';
            timeline.appendChild(card);
        }
    }

    async function countView(id, currentViews) {
        await _supabase.from('posts').update({ views: currentViews + 1 }).eq('id', id);
        document.getElementById('v-view-' + id).innerHTML = currentViews + 1;
    }

    async function addComment(id) {
        if(!loginUser) return alert('ログインしてください！');
        var input = document.getElementById('c-input-' + id);
        var text = input.value;
        if(!text) return;

        const { data } = await _supabase.from('posts').select('comments').eq('id', id).single();
        var currentComments = data.comments || [];
        currentComments.push({ user: loginUser, text: text });

        await _supabase.from('posts').update({ comments: currentComments }).eq('id', id);
        input.value = '';
        showVideos();
    }
</script>
</body>
</html>
